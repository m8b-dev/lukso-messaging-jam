name: Deploy frontend2 to GitHub Pages

# Builds the static Wall dApp (frontend2/) and publishes it to GitHub Pages.
# Fully static: the LUKSO chain is the signaling bus, Envio/STUN/RPC are all
# public endpoints, there is no backend. Users connect with the UP browser
# extension or UP Mobile (WalletConnect; optional VITE_WALLETCONNECT_PROJECT_ID
# secret, else up-modal's shared LUKSO project id).
#
# Blob lane: no relayer here, so blobs SELF-SEND (VITE_BLOBS_ENABLED=1) — the
# user's own Type-3-capable wallet sends the blob tx and pays gas; others get
# text. Blob BODY reads work direct (the public beacon is CORS-open as of
# 2026-10-23), no beacon proxy needed.
#
# Base path is /<repo>/ for a project Pages site. Override TURN at build time
# with VITE_TURN_URL / VITE_TURN_USERNAME / VITE_TURN_CREDENTIAL repo secrets
# (optional — STUN-only still works on friendly NATs).

on:
  push:
    branches: [master]
    paths:
      - 'frontend2/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Build (Pages base + blobs self-send + optional TURN)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # No relayer on public Pages → blob posts SELF-SEND (user's wallet
          # sends the Type-3 tx and pays gas; wallets that can't do Type-3 fall
          # back to text automatically). Enables the blob lane without a relayer.
          VITE_BLOBS_ENABLED: '1'
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        run: npm run build
      - name: SPA fallback (404 -> index)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend2/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
